[project]
name = "cybervision-mcp"
version = "0.1.0"
description = "MCP server for Cisco Cyber Vision Classic API v3"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
cybervision-mcp = "cybervision_mcp.server:main"
cybervision-24h-summary = "cybervision_mcp.summary_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/cybervision_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/cybervision_mcp" = "cybervision_mcp"
