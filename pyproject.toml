[project]
name = "cybervision-mcp"
version = "0.1.0"
description = "MCP server for Cisco Cyber Vision Classic API v3"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.6.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/tkj-scythe/cybervision-mcp-inspector-gadget"
Repository = "https://github.com/tkj-scythe/cybervision-mcp-inspector-gadget"
Issues = "https://github.com/tkj-scythe/cybervision-mcp-inspector-gadget/issues"

[project.scripts]
cybervision-mcp = "cybervision_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/cybervision_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"cisco-cyber-vision-api-v3.json" = "cybervision_mcp/cisco-cyber-vision-api-v3.json"

[tool.hatch.build.targets.wheel.sources]
"src/cybervision_mcp" = "cybervision_mcp"
